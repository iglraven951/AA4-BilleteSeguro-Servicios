<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Bancario - API REST</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #1a365d 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: #4ade80;
            font-size: 2.5rem;
            text-shadow: 0 0 20px rgba(74, 222, 128, 0.3);
        }
        .subtitle {
            color: #94a3b8;
            margin-top: 10px;
        }
        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: #000;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-top: 10px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .tab-btn {
            padding: 12px 25px;
            border: 2px solid rgba(74, 222, 128, 0.3);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        .tab-btn:hover, .tab-btn.active {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            border-color: #4ade80;
            color: #000;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h2 {
            color: #4ade80;
            margin-bottom: 20px;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 5px;
            color: #94a3b8;
            font-size: 0.9rem;
        }
        input, select {
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 1rem;
        }
        input:focus, select:focus {
            outline: 2px solid #4ade80;
            background: rgba(255, 255, 255, 0.1);
        }
        select option {
            background: #1a365d;
        }
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: #000;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(74, 222, 128, 0.4);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
        }
        .form-actions {
            margin-top: 20px;
            text-align: center;
        }
        .cuentas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .cuenta-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }
        .cuenta-card:hover {
            transform: translateY(-5px);
            border-color: #4ade80;
        }
        .cuenta-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }
        .cuenta-numero {
            font-family: monospace;
            font-size: 1.1rem;
            color: #4ade80;
            letter-spacing: 1px;
        }
        .cuenta-tipo {
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .tipo-AHORRO {
            background: #3b82f6;
            color: #fff;
        }
        .tipo-CORRIENTE {
            background: #8b5cf6;
            color: #fff;
        }
        .cuenta-titular {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .cuenta-dni {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
        .cuenta-saldo {
            font-size: 1.8rem;
            font-weight: bold;
            color: #4ade80;
            margin-bottom: 10px;
        }
        .cuenta-estado {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
        }
        .estado-ACTIVA {
            background: rgba(74, 222, 128, 0.2);
            color: #4ade80;
        }
        .estado-BLOQUEADA {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
        }
        .estado-CERRADA {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        .cuenta-actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .cuenta-actions .btn {
            padding: 8px 15px;
            font-size: 0.85rem;
        }
        .operacion-card {
            max-width: 500px;
            margin: 0 auto;
        }
        .movimientos-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .movimientos-table th,
        .movimientos-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .movimientos-table th {
            background: rgba(74, 222, 128, 0.1);
            color: #4ade80;
        }
        .movimiento-tipo {
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .tipo-DEPOSITO {
            background: rgba(74, 222, 128, 0.2);
            color: #4ade80;
        }
        .tipo-RETIRO {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        .tipo-TRANSFERENCIA_ENVIADA {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
        }
        .tipo-TRANSFERENCIA_RECIBIDA {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
        }
        .monto-positivo {
            color: #4ade80;
        }
        .monto-negativo {
            color: #ef4444;
        }
        .mensaje {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }
        .mensaje.exito {
            background: rgba(74, 222, 128, 0.2);
            border: 1px solid #4ade80;
            color: #4ade80;
        }
        .mensaje.error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #ef4444;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }
        #loading {
            text-align: center;
            padding: 40px;
            color: #4ade80;
        }
        .select-cuenta {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SISTEMA BANCARIO</h1>
            <p class="subtitle">Microservicio REST - Spring Boot</p>
            <span class="badge">Puerto 8080</span>
        </div>

        <div id="mensaje" class="mensaje"></div>

        <!-- Tabs de navegación -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="cuentas">Cuentas</button>
            <button class="tab-btn" data-tab="nueva-cuenta">Nueva Cuenta</button>
            <button class="tab-btn" data-tab="deposito">Deposito</button>
            <button class="tab-btn" data-tab="retiro">Retiro</button>
            <button class="tab-btn" data-tab="transferencia">Transferencia</button>
            <button class="tab-btn" data-tab="movimientos">Movimientos</button>
        </div>

        <!-- TAB: Lista de Cuentas -->
        <div id="tab-cuentas" class="tab-content active">
            <div class="card">
                <h2>Cuentas Bancarias</h2>
                <div id="loading">Cargando cuentas...</div>
                <div id="cuentasGrid" class="cuentas-grid" style="display:none;"></div>
                <div id="emptyState" class="empty-state" style="display:none;">
                    No hay cuentas registradas
                </div>
            </div>
        </div>

        <!-- TAB: Nueva Cuenta -->
        <div id="tab-nueva-cuenta" class="tab-content">
            <div class="card operacion-card">
                <h2>Crear Nueva Cuenta</h2>
                <form id="formNuevaCuenta">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="titular">Nombre del Titular</label>
                            <input type="text" id="titular" placeholder="Nombre completo" required>
                        </div>
                        <div class="form-group">
                            <label for="dni">DNI</label>
                            <input type="text" id="dni" placeholder="12345678" maxlength="8" required>
                        </div>
                        <div class="form-group">
                            <label for="tipoCuenta">Tipo de Cuenta</label>
                            <select id="tipoCuenta" required>
                                <option value="">Seleccionar...</option>
                                <option value="AHORRO">Cuenta de Ahorro</option>
                                <option value="CORRIENTE">Cuenta Corriente</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Crear Cuenta</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- TAB: Deposito -->
        <div id="tab-deposito" class="tab-content">
            <div class="card operacion-card">
                <h2>Realizar Deposito</h2>
                <form id="formDeposito">
                    <div class="form-group select-cuenta">
                        <label for="cuentaDeposito">Seleccionar Cuenta</label>
                        <select id="cuentaDeposito" required></select>
                    </div>
                    <div class="form-group">
                        <label for="montoDeposito">Monto a Depositar ($)</label>
                        <input type="number" id="montoDeposito" placeholder="0.00" step="0.01" min="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="descripcionDeposito">Descripcion (opcional)</label>
                        <input type="text" id="descripcionDeposito" placeholder="Concepto del deposito">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Realizar Deposito</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- TAB: Retiro -->
        <div id="tab-retiro" class="tab-content">
            <div class="card operacion-card">
                <h2>Realizar Retiro</h2>
                <form id="formRetiro">
                    <div class="form-group select-cuenta">
                        <label for="cuentaRetiro">Seleccionar Cuenta</label>
                        <select id="cuentaRetiro" required></select>
                    </div>
                    <div id="saldoDisponibleRetiro" style="color: #4ade80; margin-bottom: 15px;"></div>
                    <div class="form-group">
                        <label for="montoRetiro">Monto a Retirar ($)</label>
                        <input type="number" id="montoRetiro" placeholder="0.00" step="0.01" min="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="descripcionRetiro">Descripcion (opcional)</label>
                        <input type="text" id="descripcionRetiro" placeholder="Concepto del retiro">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Realizar Retiro</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- TAB: Transferencia -->
        <div id="tab-transferencia" class="tab-content">
            <div class="card operacion-card">
                <h2>Realizar Transferencia</h2>
                <form id="formTransferencia">
                    <div class="form-group select-cuenta">
                        <label for="cuentaOrigen">Cuenta Origen</label>
                        <select id="cuentaOrigen" required></select>
                    </div>
                    <div id="saldoDisponibleTransf" style="color: #4ade80; margin-bottom: 15px;"></div>
                    <div class="form-group select-cuenta">
                        <label for="cuentaDestino">Cuenta Destino</label>
                        <select id="cuentaDestino" required></select>
                    </div>
                    <div class="form-group">
                        <label for="montoTransferencia">Monto a Transferir ($)</label>
                        <input type="number" id="montoTransferencia" placeholder="0.00" step="0.01" min="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="descripcionTransferencia">Descripcion (opcional)</label>
                        <input type="text" id="descripcionTransferencia" placeholder="Concepto de la transferencia">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Realizar Transferencia</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- TAB: Movimientos -->
        <div id="tab-movimientos" class="tab-content">
            <div class="card">
                <h2>Historial de Movimientos</h2>
                <div class="form-group select-cuenta">
                    <label for="cuentaMovimientos">Seleccionar Cuenta</label>
                    <select id="cuentaMovimientos">
                        <option value="">Seleccionar cuenta...</option>
                    </select>
                </div>
                <div id="movimientosContainer">
                    <p class="empty-state">Seleccione una cuenta para ver sus movimientos</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api';
        let cuentas = [];

        // Inicialización
        document.addEventListener('DOMContentLoaded', () => {
            cargarCuentas();
            setupTabs();
            setupForms();
        });

        // Configurar tabs
        function setupTabs() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
                });
            });
        }

        // Configurar formularios
        function setupForms() {
            // Nueva cuenta
            document.getElementById('formNuevaCuenta').addEventListener('submit', crearCuenta);

            // Depósito
            document.getElementById('formDeposito').addEventListener('submit', realizarDeposito);

            // Retiro
            document.getElementById('formRetiro').addEventListener('submit', realizarRetiro);
            document.getElementById('cuentaRetiro').addEventListener('change', mostrarSaldoRetiro);

            // Transferencia
            document.getElementById('formTransferencia').addEventListener('submit', realizarTransferencia);
            document.getElementById('cuentaOrigen').addEventListener('change', mostrarSaldoTransf);

            // Movimientos
            document.getElementById('cuentaMovimientos').addEventListener('change', cargarMovimientos);
        }

        // Cargar cuentas
        async function cargarCuentas() {
            try {
                const response = await fetch(`${API_URL}/cuentas`);
                cuentas = await response.json();
                document.getElementById('loading').style.display = 'none';
                mostrarCuentas();
                actualizarSelectsCuentas();
            } catch (error) {
                document.getElementById('loading').textContent = 'Error al cargar cuentas';
            }
        }

        // Mostrar cuentas en grid
        function mostrarCuentas() {
            const grid = document.getElementById('cuentasGrid');
            const empty = document.getElementById('emptyState');

            if (cuentas.length === 0) {
                grid.style.display = 'none';
                empty.style.display = 'block';
            } else {
                grid.style.display = 'grid';
                empty.style.display = 'none';
                grid.innerHTML = cuentas.map(c => `
                    <div class="cuenta-card">
                        <div class="cuenta-header">
                            <span class="cuenta-numero">${c.numeroCuenta}</span>
                            <span class="cuenta-tipo tipo-${c.tipoCuenta}">${c.tipoCuenta}</span>
                        </div>
                        <div class="cuenta-titular">${c.titular}</div>
                        <div class="cuenta-dni">DNI: ${c.dni}</div>
                        <div class="cuenta-saldo">$${c.saldo.toFixed(2)}</div>
                        <span class="cuenta-estado estado-${c.estado}">${c.estado}</span>
                        <div class="cuenta-actions">
                            ${c.estado === 'ACTIVA' ? `
                                <button class="btn btn-secondary" onclick="bloquearCuenta('${c.numeroCuenta}')">Bloquear</button>
                            ` : c.estado === 'BLOQUEADA' ? `
                                <button class="btn btn-primary" onclick="activarCuenta('${c.numeroCuenta}')">Activar</button>
                            ` : ''}
                        </div>
                    </div>
                `).join('');
            }
        }

        // Actualizar selects de cuentas
        function actualizarSelectsCuentas() {
            const selects = ['cuentaDeposito', 'cuentaRetiro', 'cuentaOrigen', 'cuentaDestino', 'cuentaMovimientos'];
            const cuentasActivas = cuentas.filter(c => c.estado === 'ACTIVA');

            selects.forEach(selectId => {
                const select = document.getElementById(selectId);
                const currentValue = select.value;
                select.innerHTML = '<option value="">Seleccionar cuenta...</option>';
                cuentasActivas.forEach(c => {
                    select.innerHTML += `<option value="${c.numeroCuenta}">${c.numeroCuenta} - ${c.titular} ($${c.saldo.toFixed(2)})</option>`;
                });
                select.value = currentValue;
            });
        }

        // Crear cuenta
        async function crearCuenta(e) {
            e.preventDefault();
            const cuenta = {
                titular: document.getElementById('titular').value,
                dni: document.getElementById('dni').value,
                tipoCuenta: document.getElementById('tipoCuenta').value
            };

            try {
                const response = await fetch(`${API_URL}/cuentas`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(cuenta)
                });

                if (response.ok) {
                    const nuevaCuenta = await response.json();
                    mostrarMensaje(`Cuenta creada: ${nuevaCuenta.numeroCuenta}`, 'exito');
                    document.getElementById('formNuevaCuenta').reset();
                    cargarCuentas();
                }
            } catch (error) {
                mostrarMensaje('Error al crear la cuenta', 'error');
            }
        }

        // Realizar depósito
        async function realizarDeposito(e) {
            e.preventDefault();
            const data = {
                numeroCuenta: document.getElementById('cuentaDeposito').value,
                monto: parseFloat(document.getElementById('montoDeposito').value),
                descripcion: document.getElementById('descripcionDeposito').value
            };

            try {
                const response = await fetch(`${API_URL}/operaciones/deposito`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (response.ok) {
                    mostrarMensaje(`Deposito exitoso: $${data.monto.toFixed(2)}`, 'exito');
                    document.getElementById('formDeposito').reset();
                    cargarCuentas();
                } else {
                    mostrarMensaje(result.error, 'error');
                }
            } catch (error) {
                mostrarMensaje('Error al realizar el deposito', 'error');
            }
        }

        // Mostrar saldo para retiro
        function mostrarSaldoRetiro() {
            const numeroCuenta = document.getElementById('cuentaRetiro').value;
            const cuenta = cuentas.find(c => c.numeroCuenta === numeroCuenta);
            const div = document.getElementById('saldoDisponibleRetiro');
            div.textContent = cuenta ? `Saldo disponible: $${cuenta.saldo.toFixed(2)}` : '';
        }

        // Realizar retiro
        async function realizarRetiro(e) {
            e.preventDefault();
            const data = {
                numeroCuenta: document.getElementById('cuentaRetiro').value,
                monto: parseFloat(document.getElementById('montoRetiro').value),
                descripcion: document.getElementById('descripcionRetiro').value
            };

            try {
                const response = await fetch(`${API_URL}/operaciones/retiro`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (response.ok) {
                    mostrarMensaje(`Retiro exitoso: $${data.monto.toFixed(2)}`, 'exito');
                    document.getElementById('formRetiro').reset();
                    document.getElementById('saldoDisponibleRetiro').textContent = '';
                    cargarCuentas();
                } else {
                    mostrarMensaje(result.error, 'error');
                }
            } catch (error) {
                mostrarMensaje('Error al realizar el retiro', 'error');
            }
        }

        // Mostrar saldo para transferencia
        function mostrarSaldoTransf() {
            const numeroCuenta = document.getElementById('cuentaOrigen').value;
            const cuenta = cuentas.find(c => c.numeroCuenta === numeroCuenta);
            const div = document.getElementById('saldoDisponibleTransf');
            div.textContent = cuenta ? `Saldo disponible: $${cuenta.saldo.toFixed(2)}` : '';
        }

        // Realizar transferencia
        async function realizarTransferencia(e) {
            e.preventDefault();
            const data = {
                cuentaOrigen: document.getElementById('cuentaOrigen').value,
                cuentaDestino: document.getElementById('cuentaDestino').value,
                monto: parseFloat(document.getElementById('montoTransferencia').value),
                descripcion: document.getElementById('descripcionTransferencia').value
            };

            if (data.cuentaOrigen === data.cuentaDestino) {
                mostrarMensaje('No puede transferir a la misma cuenta', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/operaciones/transferencia`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (response.ok) {
                    mostrarMensaje(`Transferencia exitosa: $${data.monto.toFixed(2)}`, 'exito');
                    document.getElementById('formTransferencia').reset();
                    document.getElementById('saldoDisponibleTransf').textContent = '';
                    cargarCuentas();
                } else {
                    mostrarMensaje(result.error, 'error');
                }
            } catch (error) {
                mostrarMensaje('Error al realizar la transferencia', 'error');
            }
        }

        // Cargar movimientos
        async function cargarMovimientos() {
            const numeroCuenta = document.getElementById('cuentaMovimientos').value;
            const container = document.getElementById('movimientosContainer');

            if (!numeroCuenta) {
                container.innerHTML = '<p class="empty-state">Seleccione una cuenta para ver sus movimientos</p>';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/movimientos/${numeroCuenta}`);
                const movimientos = await response.json();

                if (movimientos.length === 0) {
                    container.innerHTML = '<p class="empty-state">No hay movimientos registrados</p>';
                } else {
                    container.innerHTML = `
                        <table class="movimientos-table">
                            <thead>
                                <tr>
                                    <th>Fecha</th>
                                    <th>Tipo</th>
                                    <th>Monto</th>
                                    <th>Saldo</th>
                                    <th>Descripcion</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${movimientos.map(m => `
                                    <tr>
                                        <td>${new Date(m.fecha).toLocaleString()}</td>
                                        <td><span class="movimiento-tipo tipo-${m.tipo}">${m.tipo.replace('_', ' ')}</span></td>
                                        <td class="${m.tipo.includes('RECIBIDA') || m.tipo === 'DEPOSITO' ? 'monto-positivo' : 'monto-negativo'}">
                                            ${m.tipo.includes('RECIBIDA') || m.tipo === 'DEPOSITO' ? '+' : '-'}$${m.monto.toFixed(2)}
                                        </td>
                                        <td>$${m.saldoPosterior.toFixed(2)}</td>
                                        <td>${m.descripcion || '-'}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                }
            } catch (error) {
                container.innerHTML = '<p class="empty-state">Error al cargar movimientos</p>';
            }
        }

        // Bloquear cuenta
        async function bloquearCuenta(numeroCuenta) {
            if (confirm('¿Esta seguro de bloquear esta cuenta?')) {
                await cambiarEstadoCuenta(numeroCuenta, 'BLOQUEADA');
            }
        }

        // Activar cuenta
        async function activarCuenta(numeroCuenta) {
            await cambiarEstadoCuenta(numeroCuenta, 'ACTIVA');
        }

        // Cambiar estado de cuenta
        async function cambiarEstadoCuenta(numeroCuenta, estado) {
            try {
                const response = await fetch(`${API_URL}/cuentas/${numeroCuenta}/estado?estado=${estado}`, {
                    method: 'PATCH'
                });
                if (response.ok) {
                    mostrarMensaje(`Cuenta ${estado.toLowerCase()}`, 'exito');
                    cargarCuentas();
                }
            } catch (error) {
                mostrarMensaje('Error al cambiar estado', 'error');
            }
        }

        // Mostrar mensaje
        function mostrarMensaje(texto, tipo) {
            const mensaje = document.getElementById('mensaje');
            mensaje.textContent = texto;
            mensaje.className = `mensaje ${tipo}`;
            mensaje.style.display = 'block';
            setTimeout(() => mensaje.style.display = 'none', 4000);
        }
    </script>
</body>
</html>

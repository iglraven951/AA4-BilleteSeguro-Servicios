# ===========================================
# CONFIGURACION DEL MICROSERVICIO BANCARIO
# Sistema de Gestion Bancaria con Spring Data JPA
# ===========================================

# --- Nombre de la aplicacion ---
spring.application.name=sistema-bancario-jpa

# --- Puerto del servidor ---
server.port=8089

# ===========================================
# CONFIGURACION DE BASE DE DATOS H2
# Base de datos embebida con persistencia en archivo
# ===========================================

# URL de conexion JDBC - Guarda datos en archivo ./data/bancodb
# DB_CLOSE_ON_EXIT=FALSE: Mantiene la BD abierta al cerrar conexiones
# AUTO_RECONNECT=TRUE: Reconexion automatica si se pierde la conexion
spring.datasource.url=jdbc:h2:file:./data/bancodb;AUTO_SERVER=TRUE

# Driver JDBC de H2
spring.datasource.driver-class-name=org.h2.Driver

# Credenciales de acceso a la base de datos
spring.datasource.username=sa
spring.datasource.password=

# ===========================================
# CONFIGURACION DE SPRING DATA JPA / HIBERNATE
# ORM para mapeo objeto-relacional
# ===========================================

# Dialecto de Hibernate para H2 (optimiza las consultas SQL)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Estrategia DDL - Como Hibernate maneja el esquema de BD:
# - none: No hace nada
# - validate: Valida el esquema, no lo modifica
# - update: Actualiza el esquema sin perder datos (recomendado desarrollo)
# - create: Crea el esquema, destruyendo datos previos
# - create-drop: Crea al iniciar y elimina al cerrar
spring.jpa.hibernate.ddl-auto=update

# Mostrar consultas SQL en consola (true para debug, false en produccion)
spring.jpa.show-sql=true

# Formatear las consultas SQL para mejor legibilidad
spring.jpa.properties.hibernate.format_sql=true

# Mostrar comentarios en las consultas SQL
spring.jpa.properties.hibernate.use_sql_comments=true

# Inicializacion diferida para mejor rendimiento de arranque
spring.jpa.open-in-view=false

# Estrategia de nombrado de tablas y columnas (snake_case)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# ===========================================
# CONSOLA H2 (Interfaz web para administrar BD)
# ===========================================

# Habilitar consola web de H2
spring.h2.console.enabled=true

# Ruta de acceso a la consola: http://localhost:8089/h2-console
spring.h2.console.path=/h2-console

# Permitir acceso desde otras maquinas (solo desarrollo)
spring.h2.console.settings.web-allow-others=false

# ===========================================
# CONFIGURACION DE POOL DE CONEXIONES (HikariCP)
# Spring Boot usa HikariCP por defecto
# ===========================================

# Numero maximo de conexiones en el pool
spring.datasource.hikari.maximum-pool-size=5

# Numero minimo de conexiones inactivas
spring.datasource.hikari.minimum-idle=2

# Tiempo maximo de vida de una conexion (30 minutos)
spring.datasource.hikari.max-lifetime=1800000

# Tiempo de espera para obtener una conexion (30 segundos)
spring.datasource.hikari.connection-timeout=30000

# Nombre del pool para identificacion en logs
spring.datasource.hikari.pool-name=BancoDB-Pool

# ===========================================
# CONFIGURACION JSON (Jackson)
# ===========================================

# Formato de salida JSON con indentacion
spring.jackson.serialization.indent-output=true

# Formato de fechas en JSON
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# Zona horaria
spring.jackson.time-zone=America/Lima

# No fallar si hay propiedades desconocidas en JSON
spring.jackson.deserialization.fail-on-unknown-properties=false

# ===========================================
# CONFIGURACION DE ERRORES Y LOGGING
# ===========================================

# Incluir mensaje de error en respuestas
server.error.include-message=always

# Incluir errores de validacion
server.error.include-binding-errors=always

# Incluir stacktrace (solo desarrollo)
server.error.include-stacktrace=on_param

# Nivel de logging para ver consultas JPA
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.data.jpa=DEBUG

# ===========================================
# CONFIGURACION DE TRANSACCIONES
# ===========================================

# Timeout por defecto para transacciones (segundos)
spring.transaction.default-timeout=30

# Rollback automatico en excepciones runtime
spring.transaction.rollback-on-commit-failure=true
